<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>REPOS - 新規案件登録</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    margin:0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Yu Gothic",
        "Meiryo",
        sans-serif;
    background:#f7f8fc;
}

.container{
    max-width:760px;
    margin:30px auto;
    padding:25px;
}

.card{
    background:white;
    border-radius:25px;
    padding:35px 30px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

h2{
    text-align:center;
    margin-bottom:35px;
}

.form-group{
    margin-bottom:28px;
}

.form-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
    text-align:center;
}

input[type="text"],
input[type="date"]{
    width:100%;
    box-sizing:border-box;
    padding:15px;
    border:1px solid #ddd;
    border-radius:14px;
    font-size:17px;
    background:white;
}

.case-name-note{
    text-align:center;
    color:#777;
    font-size:13px;
    margin-top:7px;
}

.checkbox-area{
    margin-top:10px;
    font-size:15px;
}

.checkbox-area input{
    transform:scale(1.2);
    margin-right:8px;
}

.button-area{
    text-align:center;
    margin-top:30px;
}

.save-button,
.home-button{
    width:270px;
    padding:15px;
    border:none;
    border-radius:15px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    margin:7px auto;
    display:block;
}

.save-button{
    background:#1769e0;
    color:white;
}

.home-button{
    background:#1769e0;
    color:white;
}

.save-button:hover,
.home-button:hover{
    opacity:0.9;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h2>📋 REPOS - 新規案件登録</h2>


<!-- 案件番号 -->

<div class="form-group">

<div class="form-title">
① 案件に番号をつける
</div>

<input
    type="text"
    id="caseNumber"
    placeholder="例：0006"
    maxlength="4"
>

<div class="case-name-note">
4桁の案件番号を入力してください。
</div>

</div>


<!-- 案件名 -->

<div class="form-group">

<div class="form-title">
② 案件名を入力
</div>

<input
    type="text"
    id="caseName"
    placeholder="例：○○映画オーディション"
>

<div class="case-name-note">
案件名はメンバー画面にも表示されます。
</div>

</div>


<!-- オーディション日 -->

<div class="form-group">

<div class="form-title">
③ オーディション日
</div>

<input
    type="date"
    id="auditionDate"
>

<div class="checkbox-area">

<label>

<input
    type="checkbox"
    id="dateUnknown"
>

オーディション日未定

</label>

</div>

</div>


<!-- 保存 -->

<div class="button-area">

<button
    type="button"
    class="save-button"
    onclick="saveAudition()"
>
💾 保存する
</button>

<button
    type="button"
    class="home-button"
    onclick="location.href='index.html'"
>
🏠 ホームへ戻る
</button>

</div>

</div>

</div>


<script src="app.js"></script>

</body>

</html>
