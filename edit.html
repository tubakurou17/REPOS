<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>案件を編集 - REPOS</title>

<link rel="stylesheet" href="style.css">

<style>

.form-container{
    max-width:760px;
    margin:30px auto;
    padding:25px;
}

.edit-card{
    background:#fff;
    border-radius:25px;
    padding:35px 30px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.form-group{
    margin-bottom:24px;
}

.form-group label{
    display:block;
    font-weight:bold;
    margin-bottom:9px;
    font-size:17px;
}

.form-group input,
.form-group select{
    width:100%;
    box-sizing:border-box;
    padding:14px;
    border:1px solid #ddd;
    border-radius:14px;
    font-size:17px;
    background:#fff;
}

.form-group input[readonly]{
    background:#f5f5f5;
    color:#666;
}

.note{
    text-align:center;
    color:#777;
    font-size:13px;
    margin-top:7px;
}

.button-area{
    text-align:center;
    margin-top:28px;
}

.save-edit-button,
.back-button{
    width:270px;
    padding:15px;
    border:none;
    border-radius:15px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    margin:7px auto;
    display:block;
}

.save-edit-button{
    background:#1769e0;
    color:#fff;
}

.back-button{
    background:#fff;
    border:1px solid #aaa;
    color:#333;
}

</style>

</head>


<body>


<div class="container form-container">


<div class="edit-card">


<h2
style="
text-align:center;
margin-bottom:30px;
"
>
📝 案件を編集
</h2>


<!-- 案件番号 -->

<div class="form-group">

<label>
案件番号
</label>

<input
    type="text"
    id="editCaseNumber"
    readonly
>

<div class="note">
案件番号は一覧管理のため変更しません。
</div>

</div>


<!-- 案件種類 -->

<div class="form-group">

<label>
案件種類
</label>

<select id="editCaseType">

<option value="映画・ドラマ・映像系">
🎬 映画・ドラマ・映像系
</option>

<option value="CM・スチール系">
📸 CM・スチール系
</option>

</select>

</div>


<!-- オーディション日 -->

<div class="form-group">

<label>
オーディション日
</label>

<input
    type="date"
    id="editAuditionDate"
>


<label
style="
font-weight:normal;
margin-top:12px;
display:flex;
align-items:center;
gap:8px;
"
>

<input
    type="checkbox"
    id="editDateUnknown"
    style="
        width:18px;
        height:18px;
    "
>

オーディション日未定

</label>

</div>


<!-- 保存 -->

<div class="button-area">

<button
    type="button"
    class="save-edit-button"
    id="saveEditButton"
>
💾 変更を保存
</button>


<button
    type="button"
    class="back-button"
    onclick="location.href='list.html'"
>
📋 一覧へ戻る
</button>

</div>


</div>

</div>


<script src="app.js?v=20260826-1200"></script>


<script>


/* =================================
   編集する案件ID
================================= */

const editingAuditionId =
    localStorage.getItem(
        "editingAuditionId"
    );


/* =================================
   案件を読み込む
================================= */

async function loadEditAudition(){

    if(!editingAuditionId){

        alert(
            "編集する案件が見つかりません。"
        );

        location.href="list.html";

        return;
    }


    try{

        const response =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/auditions?id=eq." +
                encodeURIComponent(
                    editingAuditionId
                ) +
                "&select=*",

                {
                    method:"GET",

                    headers:{
                        "apikey":
                            SUPABASE_KEY
                    }
                }

            );


        if(!response.ok){

            throw new Error(
                "取得失敗"
            );

        }


        const auditions =
            await response.json();


        if(
            auditions.length === 0
        ){

            alert(
                "編集する案件が見つかりません。"
            );

            localStorage.removeItem(
                "editingAuditionId"
            );

            location.href="list.html";

            return;
        }


        const audition =
            auditions[0];


        /* 案件番号 */

        document.getElementById(
            "editCaseNumber"
        ).value =
            audition.case_number || "";


        /* 案件種類 */

        document.getElementById(
            "editCaseType"
        ).value =
            audition.case_type ||
            "映画・ドラマ・映像系";


        /* AD日 */

        document.getElementById(
            "editAuditionDate"
        ).value =
            audition.audition_date || "";


        /* AD日未定 */

        document.getElementById(
            "editDateUnknown"
        ).checked =
            !!audition.date_unknown;


        document.getElementById(
            "editAuditionDate"
        ).disabled =
            !!audition.date_unknown;


    }catch(error){

        console.error(
            "編集案件取得エラー:",
            error
        );

        alert(
            "編集する案件の取得に失敗しました。"
        );

        location.href="list.html";

    }

}


/* =================================
   AD日未定
================================= */

document.getElementById(
    "editDateUnknown"
).addEventListener(
    "change",
    function(){

        document.getElementById(
            "editAuditionDate"
        ).disabled =
            this.checked;

    }
);


/* =================================
   変更を保存
================================= */

document.getElementById(
    "saveEditButton"
).addEventListener(
    "click",
    async function(){


        const caseType =
            document.getElementById(
                "editCaseType"
            ).value;


        const auditionDate =
            document.getElementById(
                "editAuditionDate"
            ).value;


        const dateUnknown =
            document.getElementById(
                "editDateUnknown"
            ).checked;


        if(
            !dateUnknown &&
            auditionDate === ""
        ){

            alert(
                "オーディション日を入力するか、「オーディション日未定」にチェックしてください。"
            );

            return;
        }


        try{


            const response =
                await fetch(

                    SUPABASE_URL +
                    "/rest/v1/auditions?id=eq." +
                    encodeURIComponent(
                        editingAuditionId
                    ),

                    {

                        method:"PATCH",

                        headers:{

                            "apikey":
                                SUPABASE_KEY,

                            "Authorization":
                                "Bearer " +
                                SUPABASE_KEY,

                            "Content-Type":
                                "application/json",

                            "Prefer":
                                "return=minimal"

                        },


                        body:
                            JSON.stringify({

                                case_type:
                                    caseType,

                                audition_date:
                                    dateUnknown
                                        ? null
                                        : auditionDate,

                                date_unknown:
                                    dateUnknown

                            })

                    }

                );


            if(!response.ok){

                const text =
                    await response.text();

                console.error(
                    "Supabase更新エラー:",
                    text
                );

                throw new Error(
                    text
                );

            }


            localStorage.removeItem(
                "editingAuditionId"
            );


            alert(
                "変更を保存しました。"
            );


            location.href =
                "list.html";


        }catch(error){

            console.error(
                "案件更新エラー:",
                error
            );

            alert(
                "変更の保存に失敗しました。"
            );

        }

    }
);


/* =================================
   編集画面開始
================================= */

loadEditAudition();

</script>


</body>

</html>
