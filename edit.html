<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>案件を編集 - REPOS</title>

<link rel="stylesheet" href="style.css">

<style>

.form-container{
    max-width:760px;
    margin:30px auto;
    padding:25px;
}

.edit-card{
    background:#ffffff;
    border-radius:25px;
    padding:35px 30px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

.form-group{
    margin-bottom:26px;
}

.form-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
    text-align:center;
}

.edit-input,
.edit-select{
    width:100%;
    box-sizing:border-box;
    padding:15px;
    border:1px solid #ddd;
    border-radius:14px;
    font-size:17px;
    background:#ffffff;
}

.edit-input[readonly]{
    background:#f5f5f5;
    color:#666;
}

.note{
    text-align:center;
    color:#777;
    font-size:13px;
    margin-top:7px;
}


/* ================================
   オーディション日未定
   ================================ */

.checkbox-area{
    width:100%;
    text-align:center;
    margin-top:14px;
    font-size:15px;
}

.checkbox-area label{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
}

.checkbox-area input{
    width:18px;
    height:18px;
    margin:0;
    cursor:pointer;
}


/* ================================
   ボタン
   ================================ */

.button-area{
    text-align:center;
    margin-top:30px;
}

.save-edit-button,
.back-button{
    width:270px;
    padding:15px;
    border:none;
    border-radius:15px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    margin:7px auto;
    display:block;
}

.save-edit-button{
    background:#1769e0;
    color:#ffffff;
}

.back-button{
    background:#ffffff;
    border:1px solid #aaa;
    color:#333;
}

.save-edit-button:hover,
.back-button:hover{
    opacity:0.9;
}


/* ================================
   管理者パソコン用
   ================================ */

@media (min-width:769px){

    .form-group .edit-input,
    .form-group .edit-select{
        width:650px !important;
        max-width:650px !important;
        margin-left:auto !important;
        margin-right:auto !important;
        display:block !important;
        box-sizing:border-box !important;
    }

    .form-group .checkbox-area{
        width:650px !important;
        max-width:650px !important;
        margin:14px auto 0 !important;
        text-align:center !important;
        display:block !important;
        box-sizing:border-box !important;
    }

}


/* ================================
   スマホ
   ================================ */

@media (max-width:768px){

    .form-container{
        width:100%;
        box-sizing:border-box;
        margin:15px auto;
        padding:15px;
    }

    .edit-card{
        padding:25px 18px;
    }

    .checkbox-area{
        text-align:center;
    }

}

</style>

</head>


<body>


<div class="container form-container">

<div class="edit-card">


<h2 style="text
