<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>案件を編集 - REPOS</title>

<link rel="stylesheet" href="style.css">

<style>

.form-container{
    max-width:600px;
    margin:30px auto;
}

.edit-card{
    background:#ffffff;
    padding:30px;
    border-radius:25px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

.form-title{
    text-align:center;
    font-size:18px;
    font-weight:bold;
    margin:22px 0 10px;
}

.edit-input,
.edit-select{
    width:100%;
    box-sizing:border-box;
    padding:14px;
    border:1px solid #ddd;
    border-radius:14px;
    font-size:17px;
    background:#fff;
}

.button-area{
    text-align:center;
    margin-top:30px;
}

.save-button,
.back-button{
    width:270px;
    padding:15px;
    border:none;
    border-radius:15px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    margin:7px auto;
    display:block;
}

.save-button{
    background:#1769e0;
    color:white;
}

.back-button{
    background:#ffffff;
    border:1px solid #aaa;
    color:#333;
}

</style>

</head>


<body>

<div class="container form-container">

<div class="edit-card">

<h2 style="text-align:center;">
📝 案件を編集
</h2>


<!-- 案件番号 -->

<div class="form-title">
案件番号
</div>

<input
    type="text"
    id="editCaseNumber"
    class="edit-input"
    maxlength="4"
>


<!-- 案件種類 -->

<div class="form-title">
案件種類
</div>

<select
    id="editCaseType"
    class="edit-select"
>

<option value="movie">
🎬 映画・ドラマ・映像系
</option>

<option value="cm">
📸 CM・スチール系
</option>

</select>


<!-- AD日 -->

<div class="form-title">
オーディション日
</div>

<input
    type="date"
    id="editAuditionDate"
    class="edit-input"
>


<div style="text-align:center;margin-top:12px;">

<label>

<input
    type="checkbox"
    id="editDateUnknown"
>

オーディション日未定

</label>

</div>


<!-- ボタン -->

<div class="button-area">

<button
    type="button"
    class="save-button"
    onclick="saveEdit()"
>
💾 変更を保存
</button>


<button
    type="button"
    class="back-button"
    onclick="location.href='list.html'"
>
📋 一覧へ戻る
</button>

</div>

</div>

</div>


<script src="app.js"></script>


<script>

/* =================================
   REPOS
   案件編集
   案件番号で対象を取得
================================= */


/* URLから案件番号を取得 */

const params =
    new URLSearchParams(location.search);

const caseNumber =
    params.get("caseNumber");


/* =================================
   案件を読み込む
================================= */

async function loadEditAudition(){

    if(!caseNumber){

        alert("編集する案件番号がありません。");

        location.href="list.html";

        return;
    }


    try{

        const response = await fetch(

            SUPABASE_URL +
            "/rest/v1/auditions?case_number=eq." +
            encodeURIComponent(caseNumber) +
            "&select=*",

            {
                method:"GET",

                headers:{
                    "apikey":SUPABASE_KEY,
                    "Authorization":
                        "Bearer " + SUPABASE_KEY
                }
            }

        );


        if(!response.ok){

            const errorText =
                await response.text();

            console.error(errorText);

            throw new Error(
                "案件取得エラー"
            );
        }


        const auditions =
            await response.json();


        if(
            !auditions ||
            auditions.length === 0
        ){

            alert(
                "編集する案件が見つかりません。"
            );

            location.href="list.html";

            return;
        }


        const audition =
            auditions[0];


        /* 案件番号 */

        document.getElementById(
            "editCaseNumber"
        ).value =
            audition.case_number || "";


        /* 案件種類 */

        document.getElementById(
            "editCaseType"
        ).value =
            audition.case_type || "movie";


        /* AD日 */

        document.getElementById(
            "editAuditionDate"
        ).value =
            audition.audition_date || "";


        /* AD日未定 */

        document.getElementById(
            "editDateUnknown"
        ).checked =
            audition.date_unknown || false;


    }catch(error){

        console.error(
            "編集案件取得エラー:",
            error
        );

        alert(
            "編集する案件の取得に失敗しました。"
        );

        location.href="list.html";
    }

}


/* =================================
   変更を保存
================================= */

async function saveEdit(){

    const newCaseNumber =
        document.getElementById(
            "editCaseNumber"
        ).value.trim();


    const caseType =
        document.getElementById(
            "editCaseType"
        ).value;


    const auditionDate =
        document.getElementById(
            "editAuditionDate"
        ).value;


    const dateUnknown =
        document.getElementById(
            "editDateUnknown"
        ).checked;


    /* 案件番号チェック */

    if(newCaseNumber === ""){

        alert(
            "案件番号を入力してください。"
        );

        return;
    }


    /* AD日チェック */

    if(
        !dateUnknown &&
        auditionDate === ""
    ){

        alert(
            "オーディション日を入力するか、「オーディション日未定」にチェックしてください。"
        );

        return;
    }


    try{

        const response = await fetch(

            SUPABASE_URL +
            "/rest/v1/auditions?case_number=eq." +
            encodeURIComponent(caseNumber),

            {
                method:"PATCH",

                headers:{

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " + SUPABASE_KEY,

                    "Content-Type":
                        "application/json",

                    "Prefer":
                        "return=representation"
                },

                body:JSON.stringify({

                    case_number:
                        newCaseNumber,

                    case_type:
                        caseType,

                    audition_date:
                        dateUnknown
                            ? null
                            : auditionDate,

                    date_unknown:
                        dateUnknown

                })
            }

        );


        if(!response.ok){

            const errorText =
                await response.text();

            console.error(
                "Supabase更新エラー:",
                errorText
            );

            throw new Error(
                errorText
            );
        }


        const result =
            await response.json();


        console.log(
            "更新結果:",
            result
        );


        alert(
            "変更を保存しました。"
        );


        location.href="list.html";


    }catch(error){

        console.error(
            "案件更新エラー:",
            error
        );

        alert(
            "変更の保存に失敗しました。"
        );

    }

}


/* 編集画面開始 */

loadEditAudition();

</script>

</body>

</html>
