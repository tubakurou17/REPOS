<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>案件を編集 - REPOS</title>

<link rel="stylesheet" href="style.css">

</head>

<body>
<div class="container form-container">

<h2>📝 案件を編集</h2>

<form id="editForm">

<label>
案件番号
</label>

<input
type="text"
id="editCaseNumber"
>

<br><br>

<label>
案件名
</label>

<input
type="text"
id="editCaseName"
>

<br><br>

<label>
オーディション日
</label>

<input
type="date"
id="editAuditionDate"
>

<br>

<label for="editDateUnknown">
<input
type="checkbox"
id="editDateUnknown"
>
オーディション日未定
</label>

<br><br>

<label>
状態
</label>

<select id="editStatus">

<option value="書類選考中">
書類選考中
</option>

<option value="書類選考終了">
書類選考終了
</option>

<option value="AD結果待ち">
AD結果待ち
</option>

<option value="AD選考終了">
AD選考終了
</option>

</select>

<br><br>

<button
type="submit"
class="home-button"
>
💾 変更を保存
</button>

</form>

<br>

<button
class="home-button"
onclick="location.href='list.html'"
>
📋 一覧へ戻る
</button>

</div>


<script>

/* =================================
   REPOS 編集画面
================================= */

const editIndex =
    localStorage.getItem("editingAuditionIndex");

const auditions =
    JSON.parse(
        localStorage.getItem("auditions") || "[]"
    );

if (
    editIndex === null ||
    !auditions[editIndex]
) {

    alert("編集する案件が見つかりません。");

    location.href = "list.html";

} else {

    const audition =
        auditions[editIndex];

    document.getElementById(
        "editCaseNumber"
    ).value =
        audition.caseNumber || "";

    document.getElementById(
        "editCaseName"
    ).value =
        audition.caseName || "";

    document.getElementById(
        "editAuditionDate"
    ).value =
        audition.auditionDate || "";

    document.getElementById(
        "editDateUnknown"
    ).checked =
        audition.dateUnknown || false;

    document.getElementById(
        "editStatus"
    ).value =
        audition.status || "書類選考中";
}


/* =================================
   変更を保存
================================= */

document.getElementById(
    "editForm"
).addEventListener(
    "submit",
    function(event) {

        event.preventDefault();

        const caseNumber =
            document.getElementById(
                "editCaseNumber"
            ).value.trim();

        const caseName =
            document.getElementById(
                "editCaseName"
            ).value.trim();

        const auditionDate =
            document.getElementById(
                "editAuditionDate"
            ).value;

        const dateUnknown =
            document.getElementById(
                "editDateUnknown"
            ).checked;

        const status =
            document.getElementById(
                "editStatus"
            ).value;


        if (caseNumber === "") {

            alert(
                "案件番号を入力してください。"
            );

            return;
        }


        if (
            !dateUnknown &&
            auditionDate === ""
        ) {

            alert(
                "オーディション日を入力するか、「オーディション日未定」にチェックしてください。"
            );

            return;
        }


        auditions[editIndex] = {

            caseNumber:
                caseNumber,

            caseName:
                caseName,

            auditionDate:
                dateUnknown
                    ? ""
                    : auditionDate,

            dateUnknown:
                dateUnknown,

            status:
                status

        };


        localStorage.setItem(
            "auditions",
            JSON.stringify(auditions)
        );


        localStorage.removeItem(
            "editingAuditionIndex"
        );


        alert("変更を保存しました。");


        location.href =
            "list.html";

    }
);

</script>

</body>

</html>
