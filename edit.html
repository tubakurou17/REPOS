<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>案件を編集 - REPOS</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container form-container">

<h2>📝 案件を編集</h2>

<form id="editForm">

<label>
案件番号
</label>

<input
type="text"
id="editCaseNumber"
>

<br><br>


<label>
案件名
</label>

<input
type="text"
id="editCaseName"
>

<br><br>


<label>
オーディション日
</label>

<input
type="date"
id="editAuditionDate"
>

<br>


<label for="editDateUnknown">

<input
type="checkbox"
id="editDateUnknown"
>

オーディション日未定

</label>

<br><br>


<label>
状態
</label>

<select id="editStatus">

<option value="書類選考中">
書類選考中
</option>

<option value="書類選考終了">
書類選考終了
</option>

<option value="AD結果待ち">
AD結果待ち
</option>

<option value="AD選考終了">
AD選考終了
</option>

</select>

<br><br>


<button
type="button"
class="home-button"
>
💾 変更を保存
</button>

</form>

<br>


<button
class="home-button"
onclick="location.href='list.html'"
>
📋 一覧へ戻る
</button>

</div>


<script src="app.js"></script>


<script>

/* =================================
   REPOS
   案件編集画面
   Supabase対応
================================= */


/*
   app.js にある
   SUPABASE_URL
   SUPABASE_KEY
   を使用します
*/


const editingAuditionId =
    localStorage.getItem("editingAuditionId");


/* =================================
   編集する案件を取得
================================= */

async function loadEditAudition() {

    if (!editingAuditionId) {

        alert("編集する案件が見つかりません。");

        location.href = "list.html";

        return;
    }


    try {

        const response = await fetch(

            SUPABASE_URL +
            "/rest/v1/auditions?id=eq." +
            encodeURIComponent(editingAuditionId) +
            "&select=*",

            {
                method: "GET",

                headers: {
                    "apikey": SUPABASE_KEY
                }
            }

        );


        if (!response.ok) {

            throw new Error(
                "案件の取得に失敗しました。"
            );

        }


        const auditions =
            await response.json();


        if (auditions.length === 0) {

            alert(
                "編集する案件が見つかりません。"
            );

            localStorage.removeItem(
                "editingAuditionId"
            );

            location.href = "list.html";

            return;
        }


        const audition =
            auditions[0];


        /* -----------------------------
           案件番号
        ----------------------------- */

        document.getElementById(
            "editCaseNumber"
        ).value =
            audition.case_number || "";


        /* -----------------------------
           案件名
        ----------------------------- */

        document.getElementById(
            "editCaseName"
        ).value =
            audition.case_name || "";


        /* -----------------------------
           オーディション日
        ----------------------------- */

        document.getElementById(
            "editAuditionDate"
        ).value =
            audition.audition_date || "";


        /* -----------------------------
           オーディション日未定
        ----------------------------- */

        document.getElementById(
            "editDateUnknown"
        ).checked =
            audition.date_unknown || false;


        /* -----------------------------
           状態
        ----------------------------- */

        document.getElementById(
            "editStatus"
        ).value =
            audition.status || "書類選考中";


    } catch (error) {

        console.error(
            "編集案件取得エラー:",
            error
        );

        alert(
            "編集する案件の取得に失敗しました。"
        );

        location.href = "list.html";
    }
}


/* =================================
   変更を保存
================================= */

document.getElementById(
    "editForm"
).addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const caseNumber =
            document.getElementById(
                "editCaseNumber"
            ).value.trim();


        const caseName =
            document.getElementById(
                "editCaseName"
            ).value.trim();


        const auditionDate =
            document.getElementById(
                "editAuditionDate"
            ).value;


        const dateUnknown =
            document.getElementById(
                "editDateUnknown"
            ).checked;


        const status =
            document.getElementById(
                "editStatus"
            ).value;


        /* -----------------------------
           案件番号チェック
        ----------------------------- */

        if (caseNumber === "") {

            alert(
                "案件番号を入力してください。"
            );

            return;
        }


        /* -----------------------------
           オーディション日チェック
        ----------------------------- */

        if (
            !dateUnknown &&
            auditionDate === ""
        ) {

            alert(
                "オーディション日を入力するか、「オーディション日未定」にチェックしてください。"
            );

            return;
        }


        try {

            const response = await fetch(

                SUPABASE_URL +
                "/rest/v1/auditions?id=eq." +
                encodeURIComponent(
                    editingAuditionId
                ),

                {
                    method: "PATCH",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Content-Type":
                            "application/json",

                        "Prefer":
                            "return=minimal"
                    },

                    body: JSON.stringify({

                        case_number:
                            caseNumber,

                        case_name:
                            caseName,

                        audition_date:
                            dateUnknown
                                ? null
                                : auditionDate,

                        date_unknown:
                            dateUnknown,

                        status:
                            status

                    })
                }

            );


            if (!response.ok) {

                throw new Error(
                    "案件の更新に失敗しました。"
                );

            }


            /* -----------------------------
               編集IDを削除
            ----------------------------- */

            localStorage.removeItem(
                "editingAuditionId"
            );


            alert(
                "変更を保存しました。"
            );


            

        } catch (error) {

            console.error(
                "案件更新エラー:",
                error
            );

            alert(
                "変更の保存に失敗しました。"
            );

        }

    }
);


/* =================================
   編集画面を開始
================================= */

loadEditAudition();

</script>

</body>

</html>
