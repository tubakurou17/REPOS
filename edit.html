<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>案件を編集 - REPOS</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    margin:0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Yu Gothic",
        "Meiryo",
        sans-serif;
    background:#f7f8fc;
}

.container{
    max-width:760px;
    margin:30px auto;
    padding:25px;
}

.card{
    background:white;
    border-radius:25px;
    padding:35px 30px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

h2{
    text-align:center;
    margin-bottom:35px;
    color:#666;
}

.form-group{
    margin-bottom:28px;
}

.form-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
    text-align:center;
}

input[type="text"],
input[type="date"],
select{
    width:100%;
    box-sizing:border-box;
    padding:15px;
    border:1px solid #ddd;
    border-radius:14px;
    font-size:17px;
    background:white;
}

input[readonly]{
    background:#f5f5f5;
    color:#777;
}

.checkbox-area{
    margin-top:14px;
    text-align:center;
    font-size:15px;
}

.checkbox-area label{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
}

.checkbox-area input{
    width:18px;
    height:18px;
    margin:0;
}

.note{
    text-align:center;
    color:#777;
    font-size:13px;
    margin-top:7px;
}

.button-area{
    text-align:center;
    margin-top:30px;
}

.save-button,
.back-button{
    width:270px;
    padding:15px;
    border:none;
    border-radius:15px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    margin:7px auto;
    display:block;
}

.save-button{
    background:#1769e0;
    color:white;
}

.back-button{
    background:#eeeeee;
    color:#555;
}

.save-button:hover,
.back-button:hover{
    opacity:0.9;
}

</style>

</head>


<body>

<div class="container">

<div class="card">

<h2>✏️ 案件情報を編集</h2>


<!-- 案件番号 -->

<div class="form-group">

<div class="form-title">
案件番号
</div>

<input
    type="text"
    id="editCaseNumber"
    readonly
>

<div class="note">
案件番号は変更できません。
</div>

</div>


<!-- 案件種類 -->

<div class="form-group">

<div class="form-title">
案件種類
</div>

<select id="editCaseType">

<option value="movie">
🎬 映画・ドラマ・映像系
</option>

<option value="cm">
📸 CM・スチール系
</option>

</select>

</div>


<!-- オーディション日 -->

<div class="form-group">

<div class="form-title">
オーディション日
</div>

<input
    type="date"
    id="editAuditionDate"
>

<div class="checkbox-area">

<label>

<input
    type="checkbox"
    id="editDateUnknown"
>

<span>
オーディション日未定
</span>

</label>

</div>

</div>


<!-- 保存 -->

<div class="button-area">

<button
    type="button"
    class="save-button"
    onclick="saveEditedAudition()"
>
💾 変更を保存
</button>

<button
    type="button"
    class="back-button"
    onclick="location.href='list.html'"
>
📋 一覧へ戻る
</button>

</div>

</div>

</div>


<script src="app.js"></script>

<script>

/* =================================
   REPOS
   案件情報編集
================================= */


/* ---------------------------------
   編集対象ID
--------------------------------- */

const editingAuditionId =
    localStorage.getItem(
        "editingAuditionId"
    );


/* =================================
   編集する案件を取得
================================= */

async function loadEditAudition(){

    if(!editingAuditionId){

        alert(
            "編集する案件が見つかりません。"
        );

        location.href =
            "list.html";

        return;

    }


    try{

        const response =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/auditions?id=eq." +
                encodeURIComponent(
                    editingAuditionId
                ) +
                "&select=*",

                {
                    method:"GET",

                    headers:{
                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY
                    }

                }

            );


        if(!response.ok){

            throw new Error(
                "案件の取得に失敗しました。"
            );

        }


        const auditions =
            await response.json();


        if(
            auditions.length === 0
        ){

            alert(
                "編集する案件が見つかりません。"
            );

            localStorage.removeItem(
                "editingAuditionId"
            );

            location.href =
                "list.html";

            return;

        }


        const audition =
            auditions[0];


        /* 案件番号 */

        document.getElementById(
            "editCaseNumber"
        ).value =
            audition.case_number || "";


        /* 案件種類 */

        document.getElementById(
            "editCaseType"
        ).value =
            audition.case_name || "movie";


        /* AD日 */

        document.getElementById(
            "editAuditionDate"
        ).value =
            audition.audition_date || "";


        /* AD日未定 */

        document.getElementById(
            "editDateUnknown"
        ).checked =
            audition.date_unknown === true;


        toggleEditDate();

    }
    catch(error){

        console.error(
            "編集案件取得エラー:",
            error
        );

        alert(
            "編集する案件の取得に失敗しました。"
        );

        location.href =
            "list.html";

    }

}


/* =================================
   AD日未定
================================= */

function toggleEditDate(){

    const checkbox =
        document.getElementById(
            "editDateUnknown"
        );

    const dateInput =
        document.getElementById(
            "editAuditionDate"
        );


    if(!checkbox || !dateInput){

        return;

    }


    if(checkbox.checked){

        dateInput.value = "";

        dateInput.disabled = true;

    }
    else{

        dateInput.disabled = false;

    }

}


/* =================================
   変更を保存
================================= */

async function saveEditedAudition(){

    if(!editingAuditionId){

        alert(
            "編集する案件が見つかりません。"
        );

        return;

    }


    const caseType =
        document.getElementById(
            "editCaseType"
        ).value;


    const auditionDate =
        document.getElementById(
            "editAuditionDate"
        ).value;


    const dateUnknown =
        document.getElementById(
            "editDateUnknown"
        ).checked;


    /* 案件種類 */

    if(caseType === ""){

        alert(
            "案件種類を選択してください。"
        );

        return;

    }


    /* AD日 */

    if(
        !dateUnknown &&
        auditionDate === ""
    ){

        alert(
            "オーディション日を入力するか、" +
            "「オーディション日未定」にチェックしてください。"
        );

        return;

    }


    try{

        const response =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/auditions?id=eq." +
                encodeURIComponent(
                    editingAuditionId
                ),

                {

                    method:"PATCH",

                    headers:{
                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY,

                        "Content-Type":
                            "application/json",

                        "Prefer":
                            "return=minimal"
                    },

                    body:
                        JSON.stringify({

                            /*
                               案件番号は変更しない
                            */

                            case_name:
                                caseType,

                            audition_date:
                                dateUnknown
                                    ? null
                                    : auditionDate,

                            date_unknown:
                                dateUnknown

                        })

                }

            );


        if(!response.ok){

            const errorText =
                await response.text();

            console.error(
                "Supabase更新エラー:",
                errorText
            );

            alert(
                "変更を保存できませんでした。\n\n" +
                errorText
            );

            return;

        }


        localStorage.removeItem(
            "editingAuditionId"
        );


        alert(
            "変更を保存しました。"
        );


        location.href =
            "list.html";


    }
    catch(error){

        console.error(
            "案件更新エラー:",
            error
        );

        alert(
            "変更の保存に失敗しました。"
        );

    }

}


/* =================================
   編集画面開始
================================= */

loadEditAudition();


/* AD日未定 */

document.getElementById(
    "editDateUnknown"
).addEventListener(
    "change",
    toggleEditDate
);

</script>

</body>

</html>
