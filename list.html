<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>REPOS - 登録案件一覧</title>

<link rel="stylesheet" href="style.css">

<style>

.table-scroll{
    width:100%;
    overflow-x:hidden;
}

.list-table{
    width:100%;
    min-width:0;
    table-layout:fixed;
    border-collapse:collapse;
}

.list-table th,
.list-table td{
    padding:10px 4px;
    text-align:center;
    border:1px solid #ddd;
    box-sizing:border-box;
    overflow:hidden;
}

.list-table th{
    background:#f5f7ff;
    font-weight:bold;
    font-size:14px;
}


/* 横スクロールなしで5列を画面内に収める */

.list-table th:nth-child(1),
.list-table td:nth-child(1){
    width:18%;
}

.list-table th:nth-child(2),
.list-table td:nth-child(2){
    width:24%;
}

.list-table th:nth-child(3),
.list-table td:nth-child(3){
    width:21%;
}

.list-table th:nth-child(4),
.list-table td:nth-child(4){
    width:27%;
}

.list-table th:nth-child(5),
.list-table td:nth-child(5){
    width:10%;
}


.type-cell{
    font-weight:bold;
    white-space:normal;
    overflow-wrap:anywhere;
    word-break:break-word;
    line-height:1.35;
}


.status-select-list{
    width:100%;
    min-width:0;
    max-width:100%;
    box-sizing:border-box;
    padding:7px 2px;
    border-radius:10px;
    border:1px solid #ddd;
    background:#fff;
    font-size:13px;
    font-weight:bold;
    text-align:center;
    cursor:pointer;
}


/* スマートフォン */

@media (max-width:600px){

    .list-table th,
    .list-table td{
        padding:9px 2px;
    }

    .list-table th{
        font-size:12px;
    }

    .list-table td{
        font-size:13px;
    }

    .status-select-list{
        font-size:11px;
        padding:7px 0;
        border-radius:9px;
    }

    .case-select-checkbox,
    .select-all-checkbox{
        width:20px !important;
        height:20px !important;
    }

}


/* 一括削除 */

.bulk-delete-area{
    text-align:center;
    margin:28px auto 20px;
}

.bulk-delete-button{
    width:270px;
    padding:15px;
    border:none;
    border-radius:15px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    background:#d9433e;
    color:#fff;
}

.bulk-delete-button:hover{
    opacity:.9;
}


/* チェックボックス */

.select-all-checkbox{
    width:24px;
    height:24px;
    cursor:pointer;
}

.case-select-checkbox{
    width:24px;
    height:24px;
    cursor:pointer;
}

</style>

</head>


<body>


<div class="container">


<h2>📋 登録案件一覧</h2>


<!-- 案件番号検索 -->

<div class="search-area">

<input
    type="text"
    placeholder="案件番号を入力"
    id="caseNumberSearch"
>

<button
    class="search-button"
    id="searchButton"
>
🔍 検索
</button>

</div>


<!-- ホーム -->

<button
    class="home-button"
    onclick="location.href='index.html'"
>
🏠 ホームへ戻る
</button>


<!-- 全件表示 -->

<button
    class="search-reset-button"
    id="searchResetButton"
>
🔄 全件表示に戻す
</button>


<!-- 一括削除 -->

<div class="bulk-delete-area">

<button
    type="button"
    class="bulk-delete-button"
    id="bulkDeleteButton"
>
🗑️ 選択した案件を削除
</button>

</div>


<!-- 案件一覧 -->

<div class="table-scroll">

<table class="list-table">

<thead>

<tr>

<th>

<div style="font-size:12px; font-weight:bold; margin-bottom:4px;">
全削除
</div>

<input
    type="checkbox"
    id="selectAllCheckbox"
    class="select-all-checkbox"
    title="全削除"
>

</th>

<th>
案件種類
</th>

<th>
AD日
</th>

<th>
状態
</th>

<th>
編集
</th>

</tr>

</thead>


<tbody id="auditionList">
</tbody>


</table>

</div>


</div>


<script src="app.js?v=20260826-1600"></script>


</body>

</html>
