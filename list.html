<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>REPOS - 登録案件一覧</title>

<link rel="stylesheet" href="style.css">

<style>

.table-scroll{
    overflow-x:auto;
}
.list-table{
    width:100%;
    min-width:0;
    max-width:900px;
    margin:0 auto;
    table-layout:fixed;
    border-collapse:collapse;
}


.list-table th,
.list-table td{
    padding:12px 8px;
    text-align:center;
    border:1px solid #ddd;
}

.list-table th{
    background:#f5f7ff;
    font-weight:bold;
}

.type-cell{
    font-weight:bold;
    white-space:nowrap;
}

.status-select-list{
    width:100%;
    min-width:0;
    padding:7px 5px;
    border-radius:10px;
    border:1px solid #ddd;
    background:#fff;
    font-size:14px;
    font-weight:bold;
    text-align:center;
    cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h2>📋 登録案件一覧</h2>


<!-- 案件番号検索 -->

<div class="search-area">

<input
    type="text"
    placeholder="案件番号を入力"
    id="caseNumberSearch"
>

<button
    class="search-button"
    id="searchButton"
>
🔍 検索
</button>

</div>


<!-- ホーム -->

<button
    class="home-button"
    onclick="location.href='index.html'"
>
🏠 ホームへ戻る
</button>


<!-- 全件表示 -->

<button
    class="search-reset-button"
    id="searchResetButton"
>
🔄 全件表示に戻す
</button>


<!-- 登録案件一覧 -->

<div class="table-scroll">

<table class="list-table">

<thead>

<tr>

<th>案件番号</th>

<th>案件種類</th>

<th>AD日</th>

<th>状態</th>

<th>編集</th>

<th>削除</th>

</tr>

</thead>


<tbody id="auditionList">
</tbody>


</table>

</div>

</div>


<script src="app.js"></script>

</body>

</html>
