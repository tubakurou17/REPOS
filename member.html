<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>REPOS - ご確認用</title>

<link rel="stylesheet" href="style.css">

<style>

/* =================================
   REPOS 所属者用画面
================================= */

.member-container {
    width: 90%;
    max-width: 500px;
    margin: 0 auto;
    text-align: center;
    position: relative;
}

.member-container h1 {
    text-align: center;
}

.member-container h2 {
    text-align: center;
}

.member-description {
    text-align: center;
    line-height: 1.7;
    margin: 15px auto 25px;
}


/* =================================
   右上の閉じるボタン
================================= */

.member-close-button {
    position: absolute;
    top: 5px;
    right: 5px;

    width: 32px;
    height: 32px;

    border: none;
    border-radius: 50%;

    background: #ffffff;
    color: #555555;

    font-size: 20px;
    font-weight: bold;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;
}

.member-close-button:hover {
    background: #f0f0f0;
}


/* =================================
   検索部分
================================= */

.member-search-area {
    width: 100%;
    text-align: center;
    margin: 0 auto 25px;
}


/* 案件番号入力 */

.member-search-area input[type="text"] {
    width: 160px;
    max-width: 160px;
    height: 44px;

    margin: 0 auto 12px;

    display: block;

    box-sizing: border-box;

    text-align: center;

    font-size: 18px;
}


/* 検索ボタン */

.member-search-area .search-button {
    display: block;

    width: 160px;

    margin: 0 auto;
}


/* =================================
   検索結果
================================= */

.member-result {
    width: 100%;
    max-width: 500px;

    margin: 25px auto;

    box-sizing: border-box;
}


/* 案件情報タイトル */

.member-result h3 {
    text-align: center;
    margin-bottom: 15px;
}


/* =================================
   案件情報の箱
================================= */

.member-info {
    width: 100%;

    box-sizing: border-box;

    border: 1px solid #cccccc;

    border-radius: 12px;

    background: #ffffff;

    overflow: hidden;
}


/* 各項目 */

.member-info > div {
    display: flex;

    align-items: center;

    border-bottom: 1px solid #eeeeee;

    min-height: 50px;
}


/* 最後の線を消す */

.member-info > div:last-child {
    border-bottom: none;
}


/* 項目名 */

.member-info strong {
    width: 120px;

    flex-shrink: 0;

    text-align: center;

    font-weight: bold;
}


/* 内容 */

.member-info span {
    flex: 1;

    text-align: center;

    padding: 10px 8px;

    box-sizing: border-box;

    overflow-wrap: anywhere;
}


/* =================================
   クリア・戻るボタン
================================= */

.member-clear-button {
    display: none;

    width: 180px;

    margin: 20px auto;

    padding: 10px 15px;

    font-size: 16px;

    font-weight: bold;

    border: 1px solid #cccccc;

    border-radius: 10px;

    background: #ffffff;

    color: #555555;

    cursor: pointer;
}

.member-clear-button:hover {
    background: #f7f7f7;
}


/* =================================
   メッセージ
================================= */

.member-message {
    text-align: center;

    margin: 20px auto;

    line-height: 1.7;

    overflow-wrap: anywhere;
}


/* =================================
   案件確認ページの案内
================================= */

.member-link-guide {
    width: 100%;

    max-width: 500px;

    margin: 0 auto 25px;

    padding: 16px;

    box-sizing: border-box;

    background: #ffffff;

    border: 1px solid #dddddd;

    border-radius: 14px;

    text-align: center;
}

.member-link-title {
    font-weight: bold;

    font-size: 17px;

    margin-bottom: 8px;
}

.member-link-text {
    font-size: 14px;

    line-height: 1.7;
}


/* =================================
   スマートフォン
================================= */

@media screen and (max-width: 480px) {

    .member-container {
        width: 92%;
    }

    .member-info strong {
        width: 100px;
        font-size: 14px;
    }

    .member-info span {
        font-size: 14px;
    }

    .member-clear-button {
        width: 170px;
        font-size: 15px;
    }

}

</style>

</head>


<body>

<div class="container member-container">


    <!-- 右上の閉じるボタン -->

    <button
        type="button"
        class="member-close-button"
        onclick="closeMemberPage()"
        aria-label="閉じる"
    >
        ✕
    </button>


    <h1>🌸 REPOS 🌸</h1>

    <h2>ご確認用</h2>


    <div class="member-link-guide">

        <div class="member-link-title">
            🌸 案件の状況はこちらから確認できます
        </div>

        <div class="member-link-text">
            案件番号を入力して、現在の状況をご確認ください。
        </div>

    </div>


    <div class="member-search-area">

        <input
            type="text"
            id="memberCaseNumber"
            maxlength="4"
            placeholder="0001"
        >

        <button
            type="button"
            class="search-button"
            onclick="searchMemberCase()"
        >
            🔍 検索
        </button>

    </div>


    <!-- 検索結果 -->

    <div
        id="memberResult"
        class="member-result"
        style="display:none;"
    >
    </div>


    <!-- クリア・戻る -->

    <button
        type="button"
        id="memberClearButton"
        class="member-clear-button"
        onclick="clearMemberSearch()"
    >
        ↩️ クリア・戻る
    </button>


    <div
        id="memberMessage"
        class="member-message"
    >
    </div>


</div>


<script>

/* =================================
   REPOS × Supabase
   所属者用 案件検索
================================= */

const SUPABASE_URL =
    "https://wnfuyczwuptkwicpullu.supabase.co";

const SUPABASE_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InduZnV5Y3p3dXB0a3dpY3B1bGx1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4Mzk0MzUsImV4cCI6MjEwMjQxNTQzNX0.dYyBPtW40RPLhH96K39DjmzUJGMHZedKSu-26sc-6fA";


/* =================================
   状態を表示用に変換
================================= */

function getMemberStatusText(status) {

    if (status === "書類選考中") {
        return "🟡 書類選考中";
    }

    if (status === "書類選考終了") {
        return "🟥 書類選考終了";
    }

    if (status === "AD結果待ち") {
        return "🟢 AD結果待ち";
    }

    if (status === "AD選考終了") {
        return "🟦 AD選考終了";
    }

    return status || "";
}


/* =================================
   AD日表示
================================= */

function getMemberDateText(audition) {

    if (
        !audition.date_unknown &&
        audition.audition_date
    ) {

        return audition.audition_date.replace(
            /-/g,
            "/"
        );

    }

    return "不明";
}


/* =================================
   所属者用 案件検索
================================= */

async function searchMemberCase() {

    const searchNumber =
        document.getElementById(
            "memberCaseNumber"
        ).value.trim();


    const result =
        document.getElementById(
            "memberResult"
        );


    const message =
        document.getElementById(
            "memberMessage"
        );


    const clearButton =
        document.getElementById(
            "memberClearButton"
        );


    /* 前回の結果を消す */

    result.style.display = "none";

    result.innerHTML = "";

    message.textContent = "";

    clearButton.style.display = "none";


    /* 案件番号未入力 */

    if (searchNumber === "") {

        message.textContent =
            "案件番号を入力してください。";

        return;
    }


    /* =================================
       Supabaseから案件番号で検索
    ================================= */

    try {

        const url =
            SUPABASE_URL +
            "/rest/v1/auditions" +
            "?select=*" +
            "&case_number=eq." +
            encodeURIComponent(searchNumber);


        const response =
            await fetch(
                url,
                {
                    method: "GET",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY
                    }
                }
            );


        /* =================================
           Supabaseエラーを確認
        ================================= */

        if (!response.ok) {

            const errorText =
                await response.text();

            console.error(
                "Supabase HTTPエラー:",
                response.status,
                errorText
            );

            message.textContent =
                "案件情報の取得に失敗しました。"
                + "（HTTP "
                + response.status
                + "）";

            return;
        }


        const auditions =
            await response.json();


        /* =================================
           案件が見つからない場合
        ================================= */

        if (
            auditions.length === 0
        ) {

            message.textContent =
                "該当する案件がありません。";

            return;
        }


        const audition =
            auditions[0];


        /* =================================
           状態
        ================================= */

        const statusText =
            getMemberStatusText(
                audition.status
            );


        /* =================================
           AD日
        ================================= */

        const dateText =
            getMemberDateText(
                audition
            );


        /* =================================
           検索結果表示
        ================================= */

        result.innerHTML = `

            <h3>📋 案件情報</h3>

            <div class="member-info">

                <div>

                    <strong>
                        案件番号
                    </strong>

                    <span>
                        ${audition.case_number || ""}
                    </span>

                </div>


                <div>

                    <strong>
                        案件名
                    </strong>

                    <span>
                        ${audition.case_name || ""}
                    </span>

                </div>


                <div>

                    <strong>
                        AD日
                    </strong>

                    <span>
                        ${dateText}
                    </span>

                </div>


                <div>

                    <strong>
                        現在の状況
                    </strong>

                    <span>
                        ${statusText}
                    </span>

                </div>

            </div>

        `;


        /* 検索結果を表示 */

        result.style.display =
            "block";


        /* クリア・戻るを表示 */

        clearButton.style.display =
            "block";


 } catch (error) {

    console.error(
        "所属者用案件検索エラー:",
        error
    );

    message.textContent =
        "検索エラー：" +
        error.message;

} 

}


/* =================================
   クリア・戻る
================================= */

function clearMemberSearch() {

    document.getElementById(
        "memberCaseNumber"
    ).value = "";


    document.getElementById(
        "memberResult"
    ).style.display = "none";


    document.getElementById(
        "memberResult"
    ).innerHTML = "";


    document.getElementById(
        "memberMessage"
    ).textContent = "";


    document.getElementById(
        "memberClearButton"
    ).style.display = "none";


    document.getElementById(
        "memberCaseNumber"
    ).focus();

}


/* =================================
   右上の ✕
   確認画面を終了
================================= */

function closeMemberPage() {

    if (window.history.length > 1) {

        window.history.back();

    } else {

        window.close();

    }

}

</script>

</body>

</html>
