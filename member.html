<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>REPOS - ご確認用</title>

<link rel="stylesheet" href="style.css">

<style>

/* =================================
   REPOS 所属者用画面
================================= */

.member-container {

    width: 90%;
    max-width: 500px;

    margin: 0 auto;

    text-align: center;

    position: relative;
}


.member-container h1 {

    text-align: center;

}


.member-container h2 {

    text-align: center;

}


/* =================================
   右上の ✕
================================= */

.member-close-button {

    position: absolute;

    top: 5px;
    right: 5px;

    width: 34px;
    height: 34px;

    border: none;

    border-radius: 50%;

    background: #ffffff;

    color: #555555;

    font-size: 21px;

    font-weight: bold;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    box-shadow:
        0 1px 5px rgba(0,0,0,0.08);

}


.member-close-button:hover {

    background: #f2f2f2;

}


/* =================================
   案件確認案内
================================= */

.member-link-guide {

    width: 100%;

    max-width: 500px;

    margin: 15px auto 25px;

    padding: 16px;

    box-sizing: border-box;

    background: #ffffff;

    border: 1px solid #dddddd;

    border-radius: 14px;

    text-align: center;

}


.member-link-title {

    font-weight: bold;

    font-size: 17px;

    margin-bottom: 8px;

}


.member-link-text {

    font-size: 14px;

    line-height: 1.7;

}


/* =================================
   検索部分
================================= */

.member-search-area {

    width: 100%;

    text-align: center;

    margin: 0 auto 25px;

}


/* 案件番号入力 */

.member-search-area input[type="text"] {

    width: 160px;

    max-width: 160px;

    height: 44px;

    margin: 0 auto 12px;

    display: block;

    box-sizing: border-box;

    text-align: center;

    font-size: 18px;

}


/* 検索ボタン */

.member-search-area .search-button {

    display: block;

    width: 160px;

    margin: 0 auto;

}


/* =================================
   検索結果
================================= */

.member-result {

    width: 100%;

    max-width: 500px;

    margin: 25px auto;

    box-sizing: border-box;

}


.member-result h3 {

    text-align: center;

    margin-bottom: 15px;

}


/* =================================
   案件情報
================================= */

.member-info {

    width: 100%;

    box-sizing: border-box;

    border: 1px solid #cccccc;

    border-radius: 12px;

    background: #ffffff;

    overflow: hidden;

}


/* 各項目 */

.member-info > div {

    display: flex;

    align-items: center;

    border-bottom: 1px solid #eeeeee;

    min-height: 50px;

}


/* 最後の線 */

.member-info > div:last-child {

    border-bottom: none;

}


/* 項目名 */

.member-info strong {

    width: 120px;

    flex-shrink: 0;

    text-align: center;

    font-weight: bold;

}


/* 内容 */

.member-info span {

    flex: 1;

    text-align: center;

    padding: 10px 8px;

    box-sizing: border-box;

    overflow-wrap: anywhere;

}


/* 状態 */

.member-status {

    font-weight: bold;

}


/* =================================
   メッセージ
================================= */

.member-message {

    text-align: center;

    margin: 20px auto;

    line-height: 1.7;

    overflow-wrap: anywhere;

}


/* =================================
   スマートフォン
================================= */

@media screen and (max-width: 480px) {

    .member-container {

        width: 92%;

    }


    .member-info strong {

        width: 100px;

        font-size: 14px;

    }


    .member-info span {

        font-size: 14px;

    }

}


/* =================================
   スマホで画面からはみ出さない
================================= */

@media screen and (max-width: 380px) {

    .member-info strong {

        width: 90px;

        font-size: 13px;

    }


    .member-info span {

        font-size: 13px;

        padding: 8px 5px;

    }

}

</style>

</head>


<body>


<div class="container member-container">


<!-- =================================
     右上の閉じる ✕
================================= -->

<button
    type="button"
    class="member-close-button"
    onclick="closeMemberPage()"
    aria-label="閉じる"
>
    ✕
</button>


<h1>🌸 REPOS 🌸</h1>

<h2>ご確認用</h2>


<!-- =================================
     案内
================================= -->

<div class="member-link-guide">

    <div class="member-link-title">

        🌸 案件の状況はこちらから確認できます

    </div>


    <div class="member-link-text">

        案件番号を入力して、現在の状況をご確認ください。

    </div>

</div>


<!-- =================================
     検索
================================= -->

<div class="member-search-area">


<input
    type="text"
    id="memberCaseNumber"
    maxlength="4"
    inputmode="numeric"
    placeholder="0001"
    autocomplete="off"
>


<button
    type="button"
    class="search-button"
    onclick="searchMemberCase()"
>

    🔍 検索

</button>


</div>


<!-- =================================
     検索結果
================================= -->

<div
    id="memberResult"
    class="member-result"
    style="display:none;"
>
</div>


<!-- =================================
     メッセージ
================================= -->

<div
    id="memberMessage"
    class="member-message"
    aria-live="polite"
>
</div>


</div>


<script>

/* =================================
   REPOS × Supabase
   所属者用 案件検索
================================= */


const SUPABASE_URL =

    "https://wnfuyczwuptkwicpullu.supabase.co";


/* =================================
   Supabase Publishable Key
================================= */

const SUPABASE_KEY =

    "sb_publishable_tJYjnFCgcvUII28F8sGKLQ_aRcwntH2";


/* =================================
   状態を表示用に変換
================================= */

function getMemberStatusText(status) {


    if (status === "書類選考中") {

        return "🟡 書類選考中";

    }


    if (status === "書類選考終了") {

        return "🟥 書類選考終了";

    }


    if (status === "AD結果待ち") {

        return "🟢 AD結果待ち";

    }


    if (status === "AD選考終了") {

        return "🟦 AD選考終了";

    }


    return status || "";

}


/* =================================
   AD日表示
================================= */

function getMemberDateText(audition) {


    if (

        !audition.date_unknown &&

        audition.audition_date

    ) {

        return audition.audition_date.replace(

            /-/g,

            "/"

        );

    }


    return "不明";

}


/* =================================
   HTML安全表示
================================= */

function escapeHtml(value) {

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =================================
   所属者用 案件検索
================================= */

async function searchMemberCase() {


    const input =

        document.getElementById(

            "memberCaseNumber"

        );


    const result =

        document.getElementById(

            "memberResult"

        );


    const message =

        document.getElementById(

            "memberMessage"

        );


    const searchNumber =

        input.value.trim();


    /* =================================
       前回の結果を消す
    ================================= */

    result.style.display = "none";

    result.innerHTML = "";

    message.textContent = "";


    /* =================================
       案件番号未入力
    ================================= */

    if (searchNumber === "") {

        message.textContent =

            "案件番号を入力してください。";

        return;

    }


    /* =================================
       Supabase検索
    ================================= */

    try {


        const url =

            SUPABASE_URL +

            "/rest/v1/auditions" +

            "?select=case_number,case_type,case_name,audition_date,date_unknown,status" +

            "&case_number=eq." +

            encodeURIComponent(

                searchNumber

            );


        const response =

            await fetch(

                url,

                {

                    method: "GET",

                    headers: {

                        "apikey":

                            SUPABASE_KEY

                    }

                }

            );


        const responseText =

            await response.text();


        /* =================================
           HTTPエラー
        ================================= */

        if (!response.ok) {


            console.error(

                "Supabase HTTPエラー:",

                response.status,

                responseText

            );


            if (response.status === 401) {

                message.textContent =

                    "Supabaseの接続情報を確認してください。（HTTP 401）";

            }

            else {

                message.textContent =

                    "案件情報の取得に失敗しました。（HTTP " +

                    response.status +

                    "）";

            }


            return;

        }


        /* =================================
           データ
        ================================= */

        const auditions =

            responseText

                ? JSON.parse(responseText)

                : [];


        /* =================================
           案件なし
        ================================= */

        if (

            !Array.isArray(auditions) ||

            auditions.length === 0

        ) {


            message.textContent =

                "該当する案件がありません。";

            return;

        }


        /* =================================
           1件取得
        ================================= */

        const audition =

            auditions[0];


        /* =================================
           状態
        ================================= */

        const statusText =

            getMemberStatusText(

                audition.status

            );


        /* =================================
           AD日
        ================================= */

        const dateText =

            getMemberDateText(

                audition

            );


        /* =================================
           検索結果表示
        ================================= */

        result.innerHTML = `

            <h3>📋 案件情報</h3>


            <div class="member-info">


                <!-- 案件番号 -->

                <div>

                    <strong>

                        案件番号

                    </strong>


                    <span>

                        ${escapeHtml(

                            audition.case_number || ""

                        )}

                    </span>

                </div>


                <!-- 案件種類 -->

                <div>

                    <strong>

                        案件種類

                    </strong>


                    <span>

                        ${escapeHtml(

                            audition.case_type || ""

                        )}

                    </span>

                </div>


                <!-- AD日 -->

                <div>

                    <strong>

                        AD日

                    </strong>


                    <span>

                        ${escapeHtml(

                            dateText

                        )}

                    </span>

                </div>


                <!-- 現在の状況 -->

                <div>

                    <strong>

                        現在の状況

                    </strong>


                    <span class="member-status">

                        ${escapeHtml(

                            statusText

                        )}

                    </span>

                </div>


            </div>

        `;


        result.style.display =

            "block";


    }


    catch (error) {


        console.error(

            "所属者用案件検索エラー:",

            error

        );


        message.textContent =

            "検索エラーが発生しました。";

    }

}


/* =================================
   右上の ✕
   確認画面を終了
================================= */

function closeMemberPage() {


    if (

        window.history.length > 1

    ) {


        window.history.back();

        return;

    }


    document.body.innerHTML = `

        <div style="

            min-height:100vh;

            display:flex;

            align-items:center;

            justify-content:center;

            text-align:center;

            font-family:

            -apple-system,

            BlinkMacSystemFont,

            'Hiragino Kaku Gothic ProN',

            'Yu Gothic',

            sans-serif;

            color:#555;

            padding:20px;

        ">


            <div>


                <div style="

                    font-size:40px;

                    margin-bottom:15px;

                ">

                    🌸

                </div>


                <div style="

                    font-size:18px;

                    font-weight:bold;

                    margin-bottom:10px;

                ">

                    ご確認画面を閉じました

                </div>


                <div style="

                    font-size:14px;

                    color:#888;

                    line-height:1.7;

                ">

                    ブラウザの戻るボタンで<br>

                    前の画面に戻れます。

                </div>


            </div>

        </div>

    `;

}


/* =================================
   Enterキーでも検索
================================= */

document

    .getElementById(

        "memberCaseNumber"

    )

    .addEventListener(

        "keydown",

        function(event) {


            if (

                event.key === "Enter"

            ) {


                event.preventDefault();

                searchMemberCase();

            }

        }

    );

</script>


</body>

</html>
